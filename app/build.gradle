plugins {
    id 'com.android.application' version '8.9.2'
    id 'org.jetbrains.kotlin.android' version '2.1.20'
}
android {
    namespace 'app.tyumex.smartdns'
    compileSdk 35
    defaultConfig {
        applicationId 'app.tyumex.smartdns'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/libsmartdns.so' } }
    signingConfigs {
        if (System.getenv('DNS_KEYSTORE')) {
            production {
                storeFile file(System.getenv('DNS_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('DNS_PASSWORD')
                keyAlias 'tyumex'
                keyPassword System.getenv('DNS_PASSWORD')
            }
        }
    }
    buildTypes { release { if (System.getenv('DNS_KEYSTORE')) signingConfig signingConfigs.production } }
}
dependencies { implementation 'androidx.core:core:1.15.0'; implementation 'com.squareup.okhttp3:okhttp:4.12.0'; implementation 'org.minidns:minidns-core:1.1.1' }
