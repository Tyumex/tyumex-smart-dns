name: Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build DNS engine and test
        run: |
          set -eu
          cd engine
          go mod tidy
          go test ./...
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for spec in 'arm64-v8a arm64 aarch64' 'x86_64 amd64 x86_64' 'armeabi-v7a arm armv7a'; do
            read -r abi arch triple <<< "$spec"
            mkdir -p "../app/src/main/jniLibs/$abi"
            GOOS=android GOARCH="$arch" GOARM=7 CGO_ENABLED=1 CC="$BIN/${triple}-linux-android26-clang" go build -trimpath -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o "../app/src/main/jniLibs/$abi/libsmartdns.so" .
          done
      - name: Assemble and verify signed APK
        env:
          DNS_KEY_B64: ${{ secrets.DNS_KEY_B64 }}
          DNS_PASSWORD: ${{ secrets.DNS_PASSWORD }}
        run: |
          set -eu
          export DNS_KEYSTORE="$RUNNER_TEMP/dns.p12"
          printf '%s' "$DNS_KEY_B64" | base64 -d > "$DNS_KEYSTORE"
          trap 'rm -f "$DNS_KEYSTORE"' EXIT
          gradle --console=plain :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Tyumex-Smart-DNS.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Tyumex-Smart-DNS.apk
          sha256sum Tyumex-Smart-DNS.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: |
            Tyumex-Smart-DNS.apk
            SHA256SUMS

